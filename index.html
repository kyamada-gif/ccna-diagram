<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0d1117" />
<title>show interface の読み取り</title>
<style>
:root{
  /* 文字は7段だけ（ipcalc2 と同じ） */
  --f1:11px; --f2:13px; --f3:15px; --f4:17px; --f5:22px; --f6:34px; --f7:44px;
  /* 余白は6きざみだけ */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:32px;
  --bg:#0d1117; --bg1:#161b22; --bg2:#21262d; --bg-tile:#262c36; --line:#30363d;
  --ink3:#484f58; --ink2:#8b949e; --ink:#e6edf3;
  --blue:#58a6ff; --blue-t:#79c0ff; --blue-bg:#132030;
  --green:#2ea043; --green-s:#238636; --green-t:#56d364; --green-bg:#0f2a16;
  --red:#f85149; --red-t:#ff7b72; --red-bg:#2a1315;
  --gold:#e3b341; --gold-bg:#241c10; --gold-line:#5c4d20;
  --sunk:#0f141b; --white:#fff; --shadow:#000a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font-size:var(--f3);line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
/* ── 動くのはページそのもの ──────────────────
 * **中に別のスクロールを作らない。**
 * 前は画面の高さに固定した箱の中だけを動かしていた。
 * その形だと、画面を拡大したときにページ自体が動かせず、
 * **本文のいちばん上まで戻れなくなる**（拡大すると、見えている範囲が
 * 箱より小さくなるのに、箱は画面の高さのままなので動かす先が無い）。
 * ふつうのページと同じように、ページ全体が動くようにしてある。
 * いちばん下のボタン（.dock）は sticky なので、これでも下に貼りついたままになる */
.wrap{flex:1 1 auto;width:100%;max-width:460px;margin:0 auto;
  padding:var(--s4) var(--s2) calc(var(--s6) + env(safe-area-inset-bottom))}

/* ホーム */
.hero{padding:var(--s4) var(--s1) var(--s5)}
.hero-t{font-size:var(--f5);font-weight:800;line-height:1.4}
.hero-n{font-size:var(--f2);color:var(--ink2);margin-top:var(--s2)}
.bar{height:8px;background:var(--bg2);border-radius:99px;margin-top:var(--s4);overflow:hidden}
.bar-in{height:100%;background:linear-gradient(90deg,var(--green),var(--green-t));
  border-radius:99px;transition:width .4s}
@media (prefers-reduced-motion:reduce){.bar-in{transition:none}}
/* ── ホーム ──────────────────────────────
 * 分野が21行。**行を押すと、その行の中に2つのボタンが出る。**
 * 42個のボタンを最初から並べると、どこを見ればいいのか分からなくなる。
 * 4つの札は、押せない小見出しとして行のかたまりを区切るだけ。
 */
.grp{margin-bottom:var(--s5)}
.grp-h{display:flex;align-items:center;gap:var(--s3);
  padding:0 var(--s1) var(--s2);margin-bottom:var(--s2);
  border-bottom:1px solid var(--line)}
.grp-n{font-family:var(--mono);font-size:var(--f4);color:var(--ink3);
  flex:0 0 auto;width:22px;text-align:center}
.grp-b{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.grp-t{font-size:var(--f3);font-weight:700}
.grp-s{font-size:var(--f1);color:var(--ink3);line-height:1.5}

.row{background:var(--bg-tile);border:1px solid var(--line);border-radius:12px;
  margin-bottom:var(--s2);overflow:hidden;transition:border-color .15s}
.row-on{border-color:var(--blue)}
.row-yet{opacity:.55}
.row-h{display:flex;align-items:center;gap:var(--s3);width:100%;
  min-height:52px;padding:var(--s2) var(--s4);
  text-align:left;background:transparent;border:0;color:inherit}
.row-h:active{opacity:.7}
.row-n{font-family:var(--mono);font-size:var(--f2);color:var(--ink3);
  flex:0 0 auto;width:26px}
.row-b{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.row-t{font-size:var(--f3);font-weight:700}
.row-s{font-family:var(--mono);font-size:var(--f1);color:var(--ink3)}
.row-v{flex:0 0 auto;color:var(--ink3);font-size:var(--f2);
  transition:transform .2s}
.row-v-on{transform:rotate(180deg);color:var(--blue)}

/* 開いた中身。上から降りてくる */
.row-p{padding:0 var(--s4) var(--s3);animation:panelin .2s ease}
@keyframes panelin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row-p{animation:none}}
.row-d{font-size:var(--f2);color:var(--ink2);line-height:1.7;margin-bottom:var(--s2)}
.row-go{display:flex;gap:var(--s2);margin-top:var(--s3)}
.row-go .go{flex:1;min-height:44px;margin-top:0;padding:10px 6px;
  font-size:var(--f3);font-weight:700}

/* 記録を消す。押し間違えないように、文字だけで下に置く */
.wipe{display:block;margin:var(--s5) auto 0;padding:var(--s2) var(--s4);
  background:transparent;border:0;color:var(--ink3);
  font-size:var(--f1);text-decoration:underline}

/* 紙面から切り出した図。白地なので、暗い画面でも見えるよう地を白のままにする */
.scan{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:var(--s2);margin-top:var(--s3);overflow-x:auto}
.scan img{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}

/* 図の下に刷られている MACアドレスの一覧 */
.mlist{margin-top:var(--s3);border:1px solid var(--line);border-radius:12px;
  background:var(--sunk);padding:var(--s2) var(--s3)}
.mrow{display:flex;gap:var(--s4);padding:6px 0;border-bottom:1px solid var(--bg2)}
.mrow:last-child{border-bottom:0}
.mk{font-size:var(--f3);font-weight:700;flex:0 0 84px}
.mv{font-family:var(--mono);font-size:var(--f3);color:var(--blue-t)}

/* 図。線と箱だけ。描くのは fig.js */
.figwrap{background:var(--sunk);border:1px solid var(--line);border-radius:12px;
  padding:var(--s3);margin-top:var(--s3);overflow-x:auto}
.fg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.fg-l{stroke:var(--ink3);stroke-width:1.5}
.fg-box{fill:var(--bg-tile);stroke:var(--line);stroke-width:1.5}
.fg-id{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle;
  font-family:-apple-system,"Hiragino Sans",sans-serif}
.fg-v{fill:var(--blue-t);font-size:11px;text-anchor:middle;font-family:ui-monospace,Menlo,monospace}
.fg-host{fill:var(--ink2);font-size:11px;text-anchor:middle;
  font-family:-apple-system,"Hiragino Sans",sans-serif}
.badge{font-size:var(--f1);color:var(--green-t);border:1px solid var(--green-s);
  border-radius:99px;padding:2px 8px;flex:0 0 auto}
.foot{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);
  font-size:var(--f2);color:var(--ink2)}

/* 練習／テストの箱 */
.card{background:var(--bg-tile);border:1px solid var(--line);border-radius:12px;
  padding:var(--s4);margin-bottom:var(--s4)}
.card-h{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.card-t{font-size:var(--f4);font-weight:800;flex:1 1 auto}
.card-s{font-size:var(--f2);color:var(--ink2);margin-bottom:var(--s1)}
.card .go{margin-top:var(--s4)}
.go-alt{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.badge-gold{color:var(--gold);border-color:var(--gold-line);font-size:var(--f3);padding:0 8px}

/* 説明の1枚 */
.sec{margin-bottom:var(--s5)}
.sec-l{display:block;font-size:var(--f1);color:var(--ink2);letter-spacing:.08em;
  margin-bottom:var(--s2)}
.brief-t{font-family:var(--mono);font-size:var(--f4);font-weight:700;color:var(--blue-t)}
.brief-b{font-size:var(--f2);color:var(--ink2);line-height:1.75;margin-top:var(--s1)}
.brief-r{display:flex;gap:var(--s3);padding:5px 0;border-bottom:1px solid var(--line)}
.brief-r:last-child{border-bottom:0}
.brief-k{font-family:var(--mono);font-size:var(--f2);color:var(--blue-t);
  flex:0 0 auto;min-width:9ch}
.brief-v{font-size:var(--f2);flex:1 1 auto;min-width:0}
.brief-hit{color:var(--green-t);font-weight:700}
.gsec{margin:var(--s5) 0 var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);
  font-size:var(--f1);color:var(--ink2);letter-spacing:.08em}
/* 見る所の名前が長いと、右の答えとぶつかって読めなくなる。
   **横に並べるのをやめて、名前を上・答えを下にする。** */
.acts{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5)}

.acts .go{margin-top:0}
.go-retry{background:linear-gradient(180deg,#27406b,#1d3052);
  color:#dbe8ff;border:1px solid #3f6aa8}
.opt-off{opacity:.45}
.badge-soon{color:var(--ink2);border-color:var(--line)}
.gloss{font-size:var(--f2);color:var(--gold);margin-top:var(--s1);line-height:1.6}

/* テストの回の並び */

/* バッジ。**どの画面でも同じ見た目。**ipcalc2 と同じ形にそろえてある。
   空の枠（破線）が置いてあり、バッジが付くと金色の枠になって 🏅 が入る。
   「まだ何も無い」ではなく「ここに入る場所がある」と見せるための形 */
.slot{flex:0 0 auto;width:44px;height:44px;border:1.5px dashed var(--line);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:var(--f5);line-height:1}
.slot.got{border-style:solid;border-color:var(--gold);background:var(--gold-bg)}
/* 小さい枠。回の一覧やタブなど、行が細い所で使う */
.slot.sm{width:32px;height:32px;border-radius:8px;font-size:var(--f3)}
/* 途中の点数。枠の下に小さく出す */
.slot-n{flex:0 0 auto;font-family:var(--mono);font-size:var(--f1);color:var(--ink3);
  text-align:center;margin-top:2px}
.slot-w{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
/* バッジの読み方。ホームのいちばん下に1行だけ置く */
.legend{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s5);
  padding:var(--s3) var(--s2);border-top:1px solid var(--line)}
.legend-t{font-size:var(--f2);color:var(--ink2);line-height:1.7}

/* 先へ進むボタンの段。
   **本文のすぐ下に置き、本文が長いときだけ画面の下に貼りつく**（position:sticky）。
   前は画面の下の段に固定していたが、本文が短いと
   「ぽつんと下に離れたボタン」になって、何のボタんか分かりにくかった。
   sticky は本文の流れの中にいるので、fixed のようにスマホでずれることもない */
.dock{position:sticky;bottom:0;z-index:2;
  width:100%;margin:var(--s5) 0 0;
  padding:var(--s3) 0 calc(var(--s3) + env(safe-area-inset-bottom));
  display:flex;gap:var(--s2);background:var(--bg)}
/* 本文が下に続いているときだけ、境目の線を出す */
.dock::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:var(--line);opacity:.6}
.dock .go{flex:1 1 0;width:auto;min-width:0;margin-top:0}
/* 進む方を広く、戻る方を狭くして、どちらが本筋かを幅で示す */
.dock .go.ghost{flex:0 0 auto;width:auto;padding-left:var(--s4);padding-right:var(--s4)}
.dock .next{flex:1;min-width:0;margin-top:0;box-shadow:0 6px 18px var(--shadow)}
/* 緑は「いま進む道」1つだけ。テストは灰の枠にして、どちらが先かを見た目で言う */
.next.ghost,.go.ghost{background:var(--bg1);border:1.5px solid var(--line);color:var(--ink)}

/* 見る所の値（読む順番） */
.vals{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.val{display:flex;align-items:baseline;gap:var(--s2);background:var(--blue-bg);
  border:1px solid var(--line);border-radius:8px;padding:var(--s2) var(--s3)}
.val-k{font-family:var(--mono);font-size:var(--f2);color:var(--blue-t)}
.val-v{font-family:var(--mono);font-size:var(--f4);font-weight:700;color:var(--ink)}

/* 一問一答 */
.head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.back{font-size:var(--f2);color:var(--ink2);padding:var(--s2) 0;min-height:44px}
.head-t{font-size:var(--f2);font-weight:700;flex:1 1 auto}
.head-n{font-family:var(--mono);font-size:var(--f2);color:var(--ink2)}

.con{background:var(--sunk);border:1px solid var(--line);border-radius:10px;
  padding:var(--s3);margin:var(--s4) 0 0;overflow-x:auto;
  font-family:var(--mono);font-size:var(--f1);line-height:1.65;color:var(--ink2);
  white-space:pre}
.cline{white-space:pre}
.ccmd{color:var(--ink)}
.chit{background:var(--blue-bg);color:var(--blue-t);border-radius:3px}
.tok{font:inherit;color:var(--blue-t);border-radius:3px;padding:0 2px;margin:0 -2px}
.tok:active{background:var(--blue-bg)}
.tok-ok{background:var(--green-bg);color:var(--green-t)}
.tok-ng{background:var(--red-bg);color:var(--red-t)}

.ask{font-size:var(--f3);margin:var(--s4) var(--s1) var(--s3)}
.code{font-family:var(--mono);font-size:var(--f2);color:var(--blue-t);
  background:var(--blue-bg);border-radius:4px;padding:1px 6px}

.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:flex;align-items:flex-start;gap:var(--s3);width:100%;text-align:left;
  background:var(--bg-tile);border:1px solid var(--line);border-radius:10px;
  padding:var(--s3) var(--s4);min-height:44px;line-height:1.55}
.opt:active{background:var(--bg2)}
.opt[disabled]{cursor:default}
.opt-k{font-family:var(--mono);font-size:var(--f2);color:var(--ink3);flex:0 0 auto;padding-top:2px}
.opt-t{flex:1 1 auto;min-width:0;font-size:var(--f3)}
.opt-m{flex:0 0 auto;font-size:var(--f3)}
.opt-ok{background:var(--green-bg);border-color:var(--green-s);color:var(--green-t)}
.opt-ok .opt-k{color:var(--green-t)}
.opt-ng{background:var(--red-bg);border-color:var(--red);color:var(--red-t);opacity:.75}
.opt-ng .opt-k{color:var(--red-t)}

/* 左と右を結ぶ問題。上に説明の札、下に入れ先 */
.mt{display:flex;flex-direction:column;gap:var(--s4)}
.mt-cards{display:flex;flex-direction:column;gap:var(--s2)}
.mt-card{display:flex;align-items:flex-start;gap:var(--s3);width:100%;text-align:left;
  background:var(--bg-tile);border:1px solid var(--line);border-radius:10px;
  padding:var(--s3) var(--s4);min-height:44px;line-height:1.55}
.mt-card:active{background:var(--bg2)}
.mt-card[disabled]{cursor:default}
.mt-l{flex:1 1 auto;min-width:0;font-size:var(--f3)}
.mt-at{flex:0 0 auto;font-size:var(--f2);font-weight:700;color:var(--ink2);
  background:var(--bg2);border-radius:99px;padding:2px var(--s3)}
.mt-m{flex:0 0 auto;font-size:var(--f2)}
/* いま持ち上げている札 */
.mt-hold{border-color:var(--green-s);border-width:2px;background:var(--green-bg)}
/* 入れ先が決まった札 */
.mt-set{background:var(--sunk)}
.mt-ok{background:var(--green-bg);border-color:var(--green-s);color:var(--green-t)}
.mt-ng{background:var(--red-bg);border-color:var(--red);color:var(--red-t)}
/* 入れ先のボタン */
.mt-targets{display:flex;flex-wrap:wrap;gap:var(--s2)}
.mt-t{flex:1 1 40%;min-height:52px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg1);padding:var(--s3);font-size:var(--f3);font-weight:700;
  color:var(--ink);line-height:1.4}
.mt-t[disabled]{opacity:.5}
.mt-t-on{border-color:var(--green-s);background:var(--green-bg);color:var(--green-t);opacity:1}
/* 答え合わせで出す「正しい組み合わせ」。組ごとに1行 */
.mt-ans{margin-top:var(--s2)}
.mt-ans-r{display:flex;align-items:baseline;gap:var(--s3);padding:4px 0}
.mt-ans-k{flex:0 0 34%;font-size:var(--f2);font-weight:700;color:var(--green-t)}
.mt-ans-v{flex:1 1 auto;min-width:0;font-size:var(--f2);color:var(--ink)}

.note{margin-top:var(--s4);border-left:3px solid var(--green-s);
  background:var(--green-bg);border-radius:0 8px 8px 0;padding:var(--s3) var(--s4)}
.note-bad{border-left-color:var(--red);background:var(--red-bg)}
.note-t{font-size:var(--f3);font-weight:700}
.note-b{font-size:var(--f2);color:var(--ink2);margin-top:var(--s1)}
.note-h{font-size:var(--f1);color:var(--ink2);margin-top:var(--s3);
  letter-spacing:.06em}

/* 答えの出し方（実際の数字） */
.steps{margin-top:var(--s2)}
.step{display:flex;align-items:baseline;gap:var(--s2);padding:3px 0}
.step-n{font-family:var(--mono);font-size:var(--f1);color:var(--ink3);
  flex:0 0 auto;width:14px;text-align:center}
.step-k{font-family:var(--mono);font-size:var(--f2);color:var(--blue-t);
  flex:0 0 auto}
.step-v{font-family:var(--mono);font-size:var(--f3);font-weight:700;color:var(--ink)}
.step-end{margin-top:var(--s1);padding-top:var(--s2);border-top:1px solid var(--line)}
.step-w{font-size:var(--f2);color:var(--ink)}

/* ほかが消える理由 */
.rej{margin-top:var(--s2)}
.rej-r{display:flex;flex-wrap:wrap;gap:0 var(--s2);padding:3px 0;
  border-bottom:1px solid var(--line)}
.rej-r:last-child{border-bottom:0}
.rej-v{font-size:var(--f2);color:var(--ink2);flex:0 0 auto}
.rej-w{font-size:var(--f2);color:var(--ink3);flex:1 1 auto;min-width:0}

.go{display:block;width:100%;margin-top:var(--s5);min-height:52px;
  background:var(--green-s);color:var(--white);font-size:var(--f4);font-weight:700;
  border-radius:12px}
.go[disabled]{background:var(--bg2);color:var(--ink3);cursor:default}
.src{font-family:var(--mono);font-size:var(--f1);color:var(--ink3);
  text-align:center;margin-top:var(--s2)}
</style>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<!-- 共通の仕掛け（判定・道すじ・出力作り）。題材の中身は入っていない -->
<script src="./store.js?v=173305" charset="utf-8"></script>
<script src="./fig.js?v=173305" charset="utf-8"></script>
<script src="./engine.js?v=173305" charset="utf-8"></script>
<!-- ブロックごとの中身。ブロックを増やしたら、ここに1行足す -->
<script src="./types/rootbridge.js?v=173305" charset="utf-8"></script>
<script src="./types/log.js?v=173305" charset="utf-8"></script>
<script src="./types/ospf.js?v=173305" charset="utf-8"></script>
<script src="./types/ospfdr.js?v=173305" charset="utf-8"></script>
<script src="./types/json.js?v=173305" charset="utf-8"></script>
<script src="./types/showint.js?v=173305" charset="utf-8"></script>
<script src="./types/etherchannel.js?v=173305" charset="utf-8"></script>
<script src="./types/trunk.js?v=173305" charset="utf-8"></script>
<script src="./types/access.js?v=173305" charset="utf-8"></script>
